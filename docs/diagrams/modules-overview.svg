<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <filter id="sh" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1100" height="520" rx="12" fill="#f8fafc"/>

  <!-- Title -->
  <rect x="0" y="0" width="1100" height="56" rx="12" fill="#7c3aed"/>
  <rect x="0" y="30" width="1100" height="26" fill="#7c3aed"/>
  <text x="550" y="36" text-anchor="middle" fill="white" font-size="20" font-weight="bold">小游智能旅行助手 — 20 个功能模块总览</text>

  <!-- Row 1: Core (5 modules) -->
  <text x="40" y="90" fill="#1e293b" font-size="14" font-weight="bold">核心功能</text>

  <rect x="40" y="100" width="180" height="72" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" filter="url(#sh)"/>
  <text x="130" y="124" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="bold">👤 用户系统</text>
  <text x="130" y="144" text-anchor="middle" fill="#64748b" font-size="10">注册·登录·JWT·积分</text>
  <text x="130" y="160" text-anchor="middle" fill="#94a3b8" font-size="9">13个API</text>

  <rect x="240" y="100" width="180" height="72" rx="10" fill="#d1fae5" stroke="#10b981" stroke-width="1.5" filter="url(#sh)"/>
  <text x="330" y="124" text-anchor="middle" fill="#065f46" font-size="13" font-weight="bold">🏞 景点管理</text>
  <text x="330" y="144" text-anchor="middle" fill="#64748b" font-size="10">列表·详情·搜索·筛选</text>
  <text x="330" y="160" text-anchor="middle" fill="#94a3b8" font-size="9">9个API</text>

  <rect x="440" y="100" width="180" height="72" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" filter="url(#sh)"/>
  <text x="530" y="124" text-anchor="middle" fill="#92400e" font-size="13" font-weight="bold">🗺 行程规划</text>
  <text x="530" y="144" text-anchor="middle" fill="#64748b" font-size="10">创建·编辑·AI生成</text>
  <text x="530" y="160" text-anchor="middle" fill="#94a3b8" font-size="9">5个API</text>

  <rect x="640" y="100" width="180" height="72" rx="10" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="1.5" filter="url(#sh)"/>
  <text x="730" y="124" text-anchor="middle" fill="#5b21b6" font-size="13" font-weight="bold">🤖 AI 对话</text>
  <text x="730" y="144" text-anchor="middle" fill="#64748b" font-size="10">流式响应·工具调用</text>
  <text x="730" y="160" text-anchor="middle" fill="#94a3b8" font-size="9">3个API</text>

  <rect x="840" y="100" width="220" height="72" rx="10" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5" filter="url(#sh)"/>
  <text x="950" y="124" text-anchor="middle" fill="#9d174d" font-size="13" font-weight="bold">🤖 AI 行程生成</text>
  <text x="950" y="144" text-anchor="middle" fill="#64748b" font-size="10">LLM驱动·结构化输出</text>
  <text x="950" y="160" text-anchor="middle" fill="#94a3b8" font-size="9">app.py:4091</text>

  <!-- Row 2: User Engagement (5) -->
  <text x="40" y="210" fill="#1e293b" font-size="14" font-weight="bold">用户互动</text>

  <rect x="40" y="220" width="180" height="62" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" filter="url(#sh)"/>
  <text x="130" y="244" text-anchor="middle" fill="#991b1b" font-size="13" font-weight="bold">❤️ 收藏</text>
  <text x="130" y="264" text-anchor="middle" fill="#64748b" font-size="10">收藏·取消收藏</text>

  <rect x="240" y="220" width="180" height="62" rx="10" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1.5" filter="url(#sh)"/>
  <text x="330" y="244" text-anchor="middle" fill="#134e4a" font-size="13" font-weight="bold">👣 足迹</text>
  <text x="330" y="264" text-anchor="middle" fill="#64748b" font-size="10">浏览历史·停留时长</text>

  <rect x="440" y="220" width="180" height="62" rx="10" fill="#ecfccb" stroke="#84cc16" stroke-width="1.5" filter="url(#sh)"/>
  <text x="530" y="244" text-anchor="middle" fill="#365314" font-size="13" font-weight="bold">📝 旅行游记</text>
  <text x="530" y="264" text-anchor="middle" fill="#64748b" font-size="10">发布·点赞·评论</text>

  <rect x="640" y="220" width="180" height="62" rx="10" fill="#fef9c3" stroke="#eab308" stroke-width="1.5" filter="url(#sh)"/>
  <text x="730" y="244" text-anchor="middle" fill="#854d0e" font-size="13" font-weight="bold">🎫 优惠券</text>
  <text x="730" y="264" text-anchor="middle" fill="#64748b" font-size="10">领取·使用·验证</text>

  <rect x="840" y="220" width="220" height="62" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5" filter="url(#sh)"/>
  <text x="950" y="244" text-anchor="middle" fill="#3730a3" font-size="13" font-weight="bold">🔔 通知</text>
  <text x="950" y="264" text-anchor="middle" fill="#64748b" font-size="10">消息推送·已读未读</text>

  <!-- Row 3: Services (5) -->
  <text x="40" y="320" fill="#1e293b" font-size="14" font-weight="bold">外部服务</text>

  <rect x="40" y="330" width="180" height="62" rx="10" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1.5" filter="url(#sh)"/>
  <text x="130" y="354" text-anchor="middle" fill="#0c4a6e" font-size="13" font-weight="bold">🌤 天气查询</text>
  <text x="130" y="374" text-anchor="middle" fill="#64748b" font-size="10">实时天气·预报</text>

  <rect x="240" y="330" width="180" height="62" rx="10" fill="#fdf4ff" stroke="#d946ef" stroke-width="1.5" filter="url(#sh)"/>
  <text x="330" y="354" text-anchor="middle" fill="#86198f" font-size="13" font-weight="bold">✈️ 机票预订</text>
  <text x="330" y="374" text-anchor="middle" fill="#64748b" font-size="10">航班搜索·详情</text>

  <rect x="440" y="330" width="180" height="62" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.5" filter="url(#sh)"/>
  <text x="530" y="354" text-anchor="middle" fill="#9a3412" font-size="13" font-weight="bold">🏨 酒店预订</text>
  <text x="530" y="374" text-anchor="middle" fill="#64748b" font-size="10">酒店搜索·房型</text>

  <rect x="640" y="330" width="180" height="62" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" filter="url(#sh)"/>
  <text x="730" y="354" text-anchor="middle" fill="#166534" font-size="13" font-weight="bold">🗺 地图定位</text>
  <text x="730" y="374" text-anchor="middle" fill="#64748b" font-size="10">高德API·周边搜索</text>

  <rect x="840" y="330" width="220" height="62" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" filter="url(#sh)"/>
  <text x="950" y="354" text-anchor="middle" fill="#334155" font-size="13" font-weight="bold">🔍 全局搜索</text>
  <text x="950" y="374" text-anchor="middle" fill="#64748b" font-size="10">景点·商品·跨模块</text>

  <!-- Row 4: Admin & Ops (5) -->
  <text x="40" y="430" fill="#1e293b" font-size="14" font-weight="bold">运营管理</text>

  <rect x="40" y="440" width="180" height="62" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5" filter="url(#sh)"/>
  <text x="130" y="464" text-anchor="middle" fill="#1e293b" font-size="13" font-weight="bold">⚙️ 管理员系统</text>
  <text x="130" y="484" text-anchor="middle" fill="#64748b" font-size="10">用户·景点·地区管理</text>

  <rect x="240" y="440" width="180" height="62" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" filter="url(#sh)"/>
  <text x="330" y="464" text-anchor="middle" fill="#065f46" font-size="13" font-weight="bold">📊 统计面板</text>
  <text x="330" y="484" text-anchor="middle" fill="#64748b" font-size="10">平台数据·运营分析</text>

  <rect x="440" y="440" width="180" height="62" rx="10" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5" filter="url(#sh)"/>
  <text x="530" y="464" text-anchor="middle" fill="#6b21a8" font-size="13" font-weight="bold">📸 媒体服务</text>
  <text x="530" y="484" text-anchor="middle" fill="#64748b" font-size="10">图片上传·文件管理</text>

  <rect x="640" y="440" width="180" height="62" rx="10" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5" filter="url(#sh)"/>
  <text x="730" y="464" text-anchor="middle" fill="#9f1239" font-size="13" font-weight="bold">🎫 客服工单</text>
  <text x="730" y="484" text-anchor="middle" fill="#64748b" font-size="10">提交·回复·状态跟踪</text>

  <rect x="840" y="440" width="220" height="62" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5" filter="url(#sh)"/>
  <text x="950" y="464" text-anchor="middle" fill="#075985" font-size="13" font-weight="bold">💡 个性化推荐</text>
  <text x="950" y="484" text-anchor="middle" fill="#64748b" font-size="10">协同过滤·行为分析</text>
</svg>