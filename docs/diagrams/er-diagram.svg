  <text x="52" y="148" fill="#334155" font-size="11">username / email / phone</text>
  <text x="52" y="166" fill="#334155" font-size="11">password_hash</text>
  <text x="52" y="184" fill="#334155" font-size="11">avatar / membership_level</text>
